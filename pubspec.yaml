name: versal
description: "Versal Barbershop - Appointment Management"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0
  firebase_auth: ^6.5.4
  cloud_functions: ^6.3.3

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Dependency injection
  get_it: ^9.2.1

  # UI
  google_fonts: ^8.1.0
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true


  assets:
    - assets/images/


